[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bas-service"
version = "1.1.0"
description = "BAS mission planning demonstrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  # zoneinfo has no time zone database on Windows without it (restriction zone schedules).
  "tzdata>=2024.1; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bas = ["catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
